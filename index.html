<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="HelmSight — Project Delivery Intelligence for Project and Delivery Managers."
    >
    <meta name="theme-color" content="#f5f1e8">
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png">
    <style>
      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background:
          radial-gradient(circle at 15% 15%, rgb(23 122 88 / 6%), transparent 26rem),
          #f5f1e8;
        color: #1e2421;
        color-scheme: light;
      }

      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background:
          radial-gradient(circle at 15% 15%, rgb(111 213 163 / 6%), transparent 26rem),
          #111512;
        color: #f1eee5;
        color-scheme: dark;
      }

      /* Public screens must paint dark before React and the route CSS load. */
      html[data-public-page='true'],
      html[data-public-page='true'] body {
        background: #02090d;
        color: #f7fafb;
        color-scheme: dark;
      }

      body,
      #root {
        min-height: 100dvh;
      }

      /* Visible before the React bundle, storage recovery, or lazy route resolves. */
      .startup-shell {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        padding: 2rem;
        background: #f5f1e8;
        color: #1e2421;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      html[data-theme='dark'] .startup-shell {
        background: #111512;
        color: #f1eee5;
      }

      html[data-public-page='true'] .startup-shell {
        background: #02090d;
        color: #f7fafb;
      }

      .startup-brand {
        font-size: 1.5rem;
        font-weight: 750;
        letter-spacing: -0.055em;
      }

      .startup-brand span {
        color: #177a58;
      }

      html[data-public-page='true'] .startup-brand span {
        color: #32ead5;
      }

      .startup-wait {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        color: inherit;
        font-size: 0.82rem;
        opacity: 0;
        animation: startup-reveal 1ms step-end 250ms forwards;
      }

      .startup-spinner {
        width: 0.9rem;
        height: 0.9rem;
        border: 2px solid currentColor;
        border-top-color: #177a58;
        border-radius: 50%;
        animation: startup-spin 900ms linear infinite;
      }

      html[data-public-page='true'] .startup-spinner {
        border-top-color: #32ead5;
      }

      /* Keep the intentional loading delay even while app entrance animations are disabled. */
      html[data-app-booting='true'] .startup-wait {
        animation: startup-reveal 1ms step-end 250ms forwards !important;
      }

      html[data-app-booting='true'] .startup-spinner {
        animation: startup-spin 900ms linear infinite !important;
      }

      @keyframes startup-reveal {
        to { opacity: 1; }
      }

      @keyframes startup-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-spinner,
        html[data-app-booting='true'] .startup-spinner {
          animation: none !important;
        }
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement
        root.dataset.appBooting = 'true'

        // Vite replaces %BASE_URL% for / and nested deployments (e.g. /helmsight/).
        const basePath = '%BASE_URL%'.replace(/\/+$/, '')
        const pathname = window.location.pathname
        const routePath = basePath && (pathname === basePath || pathname.startsWith(`${basePath}/`))
          ? pathname.slice(basePath.length) || '/'
          : pathname
        const normalizedRoute = routePath.replace(/\/+$/, '') || '/'
        const isLanding = normalizedRoute === '/'
        const isAuth = ['/sign-in', '/sign-up', '/forgot-password', '/reset-password']
          .includes(normalizedRoute)

        if (isLanding || isAuth) {
          root.dataset.publicPage = 'true'
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#02090d')
        }

        if (isLanding) {
          root.dataset.theme = 'light'
          root.dataset.themeMode = 'marketing'
          return
        }

        try {
          const rawPreferences = window.localStorage.getItem('helmsight:p0:v1:preferences')
          const preferences = rawPreferences ? JSON.parse(rawPreferences) : null
          const themeMode = ['light', 'dark', 'system'].includes(preferences?.themeMode)
            ? preferences.themeMode
            : 'system'
          const resolvedTheme = themeMode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : themeMode

          root.dataset.theme = resolvedTheme
          root.dataset.themeMode = themeMode
          if (!isAuth) {
            document.querySelector('meta[name="theme-color"]')?.setAttribute(
              'content',
              resolvedTheme === 'dark' ? '#111512' : '#f5f1e8',
            )
          }
        } catch {
          root.dataset.theme = 'light'
          root.dataset.themeMode = 'system'
        }
      })()
    </script>
    <title>HelmSight — Project Delivery Intelligence</title>
  </head>
  <body>
    <div id="root">
      <main class="startup-shell" role="status" aria-label="Loading HelmSight">
        <span class="startup-brand" aria-hidden="true">Helm<span>Sight</span></span>
        <span class="startup-wait" aria-hidden="true">
          <span class="startup-spinner" aria-hidden="true"></span>
          Loading HelmSight…
        </span>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
